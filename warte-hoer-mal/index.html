<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warte, hör mal</title>
<meta name="description" content="Wahre Geschichten, die völlig erfunden klingen, erzählt wie von einem Kumpel. Eine Geschichte = ein Buch zum Weiterlesen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --fond:#14110d; --carte:#1f1a14; --or:#e2be78; --texte:#f3ede3; --doux:#b9ad9a; }
* { box-sizing:border-box; }
body { margin:0; background:var(--fond); color:var(--texte); font:17px/1.5 Lora, Georgia, serif; }
main { max-width:640px; margin:0 auto; padding:32px 16px 64px; }
h1 { font-family:"Playfair Display", serif; color:var(--or); font-size:2rem; margin:0 0 4px; text-align:center; }
.intro { text-align:center; color:var(--doux); margin:0 0 28px; }
.histoire { display:flex; gap:14px; background:var(--carte); border-radius:14px; padding:12px; margin-bottom:14px; }
.histoire img { width:96px; height:120px; object-fit:cover; border-radius:8px; flex:none; }
.sur { color:var(--or); font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; font-weight:600; }
h2 { font-family:"Playfair Display", serif; font-size:1.1rem; margin:2px 0 6px; }
p { margin:0 0 8px; color:var(--doux); font-size:.95rem; }
a { color:var(--or); }
.livre { font-size:.9rem; }
.sources { font-size:.75rem; opacity:.7; }
footer { text-align:center; color:var(--doux); font-size:.8rem; margin-top:32px; }
</style></head>
<body><main>
<h1>Warte, hör mal</h1>
<p class="intro">Wahre Geschichten, die völlig erfunden klingen, erzählt wie von einem Kumpel. Eine Geschichte = ein Buch zum Weiterlesen.<br><a href="https://www.instagram.com/warte.hoer.mal/">@warte.hoer.mal</a></p>
<p class="intro">Die ersten Geschichten kommen ganz bald!</p>
<footer></footer>
</main></body></html>
